baseURL = "https://alexhermida.dev/"
title = "Álex Hermida"
theme = "PaperMod"
env = "production"

defaultContentLanguage = "en"
locale = "en"
hasCJKLanguage = false

enableRobotsTXT = true

[markup.highlight]
codeFences = true
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[params]
author = "Álex Hermida"
description = "Álex Hermida's personal site about software engineering, AI systems, agents, Python, and building reliable production software."
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = false
mainSections = ["posts"]
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowToc = false
ShowShareButtons = false
ShowRssButtonInSectionTermList = true

[params.assets]
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"
safari_pinned_tab = "safari-pinned-tab.svg"
theme_color = "#1d1e20"
msapplication_TileColor = "#1d1e20"

[params.homeInfoParams]
Title = "Hi, I'm Álex 👋"
Content = "I'm a Principal Software Engineer working across software, data, and AI. I write about building reliable systems, AI agents, Python, and the engineering problems that appear when new technologies reach production."

[[params.socialIcons]]
name = "github"
url = "https://github.com/alexhermida"

[[params.socialIcons]]
name = "bluesky"
url = "https://bsky.app/profile/alexhermida.dev"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/alexhermida/"

[menu]
[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
name = "Talks"
url = "/talks/"
weight = 20

[[menu.main]]
name = "About"
url = "/about/"
weight = 30
